name: Biome

on:
  workflow_call:

permissions: {}

jobs:
  biome:
    name: Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci
