name: Compose Multiplatform lint

on:
  workflow_call:
    inputs:
      detekt-task:
        type: string
        required: false
        default: detekt
      ktlint-task:
        type: string
        required: false
        default: ktlintCheck

permissions: {}

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out repo-config
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK
        uses: ./.repo-config/.github/actions/setup-jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Detekt
        env:
          TASK: ${{ inputs.detekt-task }}
        run: ./gradlew "$TASK"

  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out repo-config
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK
        uses: ./.repo-config/.github/actions/setup-jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        env:
          TASK: ${{ inputs.ktlint-task }}
        run: ./gradlew "$TASK"

  version-catalog:
    name: Version catalog format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out repo-config
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK
        uses: ./.repo-config/.github/actions/setup-jdk

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format the version catalog
        run: ./gradlew versionCatalogFormat

      - name: Check that formatting changed nothing
        run: git diff --exit-code
