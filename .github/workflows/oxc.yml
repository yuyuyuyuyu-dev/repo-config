name: Oxc

on:
  workflow_call:

permissions: {}

jobs:
  oxlint:
    name: Oxlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Oxlint
        run: pnpm install --frozen-lockfile

      - name: Run Oxlint
        run: pnpm run oxlint

  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Oxfmt
        run: pnpm install --frozen-lockfile

      - name: Run Oxfmt
        run: pnpm run oxfmt --check
