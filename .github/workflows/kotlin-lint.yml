name: Kotlin lint

on:
  workflow_call:
    inputs:
      jdk-distribution:
        type: string
        required: false
      jdk-version:
        type: string
        required: false
      working-directory:
        type: string
        required: false
        default: .

permissions: {}

jobs:
  check-inputs:
    name: Check the inputs
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check the JDK inputs
        if: (inputs.jdk-distribution == '') != (inputs.jdk-version == '')
        run: |
          echo "::error::Pass jdk-distribution and jdk-version together, or neither."
          exit 1

  detekt:
    name: Detekt
    needs: check-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out repo-config
        if: inputs.jdk-distribution == ''
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK of Compose Multiplatform
        if: inputs.jdk-distribution == ''
        uses: ./.repo-config/.github/actions/setup-jdk

      - name: Set up the JDK
        if: inputs.jdk-distribution != ''
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.jdk-version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Detekt
        run: ./gradlew detekt

  ktlint:
    name: ktlint
    needs: check-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out repo-config
        if: inputs.jdk-distribution == ''
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK of Compose Multiplatform
        if: inputs.jdk-distribution == ''
        uses: ./.repo-config/.github/actions/setup-jdk

      - name: Set up the JDK
        if: inputs.jdk-distribution != ''
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.jdk-version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ktlint
        run: ./gradlew ktlintCheck

  version-catalog:
    name: Version catalog format
    needs: check-inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out repo-config
        if: inputs.jdk-distribution == ''
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK of Compose Multiplatform
        if: inputs.jdk-distribution == ''
        uses: ./.repo-config/.github/actions/setup-jdk

      - name: Set up the JDK
        if: inputs.jdk-distribution != ''
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.jdk-distribution }}
          java-version: ${{ inputs.jdk-version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Format the version catalog
        run: ./gradlew versionCatalogFormat

      - name: Check that formatting changed nothing
        run: git diff --exit-code
