name: Update yarn.lock

on:
  workflow_call:
    inputs:
      app-client-id:
        type: string
        required: true
      update-js-yarn-lock:
        type: boolean
        required: false
        default: false
      update-wasm-yarn-lock:
        type: boolean
        required: false
        default: false
      working-directory:
        type: string
        required: false
        default: .
    secrets:
      app-private-key:
        required: true

permissions: {}

concurrency: chore/update-yarn-lock

env:
  KOTLIN_JS_STORE: ${{ inputs.working-directory == '.' && 'kotlin-js-store' || format('{0}/kotlin-js-store', inputs.working-directory) }}

jobs:
  regenerate:
    name: Regenerate yarn.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out repo-config
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: ./.repo-config/.github/actions/setup-jdk-and-gradle
        with:
          compose-multiplatform: true

      - name: Regenerate yarn.lock
        env:
          UPDATE_JS_YARN_LOCK: ${{ inputs.update-js-yarn-lock }}
          UPDATE_WASM_YARN_LOCK: ${{ inputs.update-wasm-yarn-lock }}
        run: |
          tasks=()
          if [ "$UPDATE_JS_YARN_LOCK" = true ]; then
            rm -f kotlin-js-store/yarn.lock build/js/yarn.lock
            tasks+=(kotlinUpgradeYarnLock)
          fi
          if [ "$UPDATE_WASM_YARN_LOCK" = true ]; then
            rm -f kotlin-js-store/wasm/yarn.lock build/wasm/yarn.lock
            tasks+=(kotlinWasmUpgradeYarnLock)
          fi
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::Set update-js-yarn-lock, update-wasm-yarn-lock or both to true."
            exit 1
          fi
          ./gradlew "${tasks[@]}"

      - name: Upload yarn.lock
        uses: actions/upload-artifact@v7
        with:
          name: yarn-lock
          path: ${{ env.KOTLIN_JS_STORE }}
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open or update the pull request
    needs: regenerate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.regenerate.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download yarn.lock
        uses: actions/download-artifact@v8
        with:
          name: yarn-lock
          path: ${{ env.KOTLIN_JS_STORE }}

      - name: Open or update the pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.event.repository.default_branch }}
          sign-commits: true
          add-paths: ${{ env.KOTLIN_JS_STORE }}
          branch: chore/update-yarn-lock
          delete-branch: true
          commit-message: "build(deps): update yarn.lock"
          title: "build(deps): update yarn.lock"
          body: "The yarn.lock files in `${{ env.KOTLIN_JS_STORE }}` were deleted and resolved again, so every npm package moved to the newest version its range allows. Upgrading the stored `yarn.lock` instead would keep the versions it already has."
          labels: dependencies

      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PULL_REQUEST"
