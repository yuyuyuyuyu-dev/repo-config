name: Oxfmt

on:
  workflow_call:

permissions: {}

jobs:
  oxfmt:
    name: Oxfmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Oxfmt
        run: npm ci

      - name: Run Oxfmt
        run: npm run oxfmt -- --check
