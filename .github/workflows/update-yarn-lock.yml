name: Update yarn.lock

on:
  workflow_call:
    inputs:
      app-client-id:
        type: string
        required: true
      update-js-yarn-lock:
        type: boolean
        required: false
        default: false
      update-wasm-yarn-lock:
        type: boolean
        required: false
        default: false
      working-directories:
        type: string
        required: false
        default: .
    secrets:
      app-private-key:
        required: true

permissions: {}

concurrency: chore/update-yarn-lock

jobs:
  regenerate:
    name: Regenerate yarn.lock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}
      kotlin-js-stores: ${{ steps.regenerate.outputs.kotlin-js-stores }}
    steps:
      - name: Check out the repository
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check out repo-config
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .repo-config
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Set up the JDK and Gradle
        uses: ./.repo-config/.github/actions/setup-jdk-and-gradle
        with:
          compose-multiplatform: true

      - name: Regenerate yarn.lock
        id: regenerate
        env:
          UPDATE_JS_YARN_LOCK: ${{ inputs.update-js-yarn-lock }}
          UPDATE_WASM_YARN_LOCK: ${{ inputs.update-wasm-yarn-lock }}
          WORKING_DIRECTORIES: ${{ inputs.working-directories }}
        run: |
          tasks=()
          lockfiles=()
          if [ "$UPDATE_JS_YARN_LOCK" = true ]; then
            tasks+=(kotlinUpgradeYarnLock)
            lockfiles+=(kotlin-js-store/yarn.lock build/js/yarn.lock)
          fi
          if [ "$UPDATE_WASM_YARN_LOCK" = true ]; then
            tasks+=(kotlinWasmUpgradeYarnLock)
            lockfiles+=(kotlin-js-store/wasm/yarn.lock build/wasm/yarn.lock)
          fi
          if [ "${#tasks[@]}" -eq 0 ]; then
            echo "::error::Set update-js-yarn-lock, update-wasm-yarn-lock or both to true."
            exit 1
          fi
          mapfile -t directories < <(printf '%s\n' "$WORKING_DIRECTORIES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's:/*$::' -e '/^$/d')
          if [ "${#directories[@]}" -eq 0 ]; then
            echo "::error::Name at least one directory that has gradlew in working-directories."
            exit 1
          fi
          kotlin_js_stores=()
          for directory in "${directories[@]}"; do
            (
              cd "$directory"
              rm -f "${lockfiles[@]}"
              ./gradlew "${tasks[@]}"
            )
            if [ "$directory" = . ]; then
              kotlin_js_stores+=(kotlin-js-store)
            else
              kotlin_js_stores+=("$directory/kotlin-js-store")
            fi
          done
          tar -cf "$RUNNER_TEMP/yarn-lock.tar" "${kotlin_js_stores[@]}"
          delimiter="$(dd if=/dev/urandom bs=15 count=1 status=none | base64)"
          {
            echo "kotlin-js-stores<<$delimiter"
            printf '%s\n' "${kotlin_js_stores[@]}"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Upload yarn.lock
        uses: actions/upload-artifact@v7
        with:
          name: yarn-lock
          path: ${{ runner.temp }}/yarn-lock.tar
          if-no-files-found: error
          retention-days: 1

  pull-request:
    name: Open or update the pull request
    needs: regenerate
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Create a token for the app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.regenerate.outputs.commit }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download yarn.lock
        uses: actions/download-artifact@v8
        with:
          name: yarn-lock
          path: ${{ runner.temp }}

      - name: Put yarn.lock in place
        run: tar -xf "$RUNNER_TEMP/yarn-lock.tar"

      - name: Open or update the pull request
        id: pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          base: ${{ github.event.repository.default_branch }}
          sign-commits: true
          add-paths: ${{ needs.regenerate.outputs.kotlin-js-stores }}
          branch: chore/update-yarn-lock
          delete-branch: true
          commit-message: "build(deps): update yarn.lock"
          title: "build(deps): update yarn.lock"
          body: "The yarn.lock files were deleted and resolved again, so every npm package moved to the newest version its range allows. Upgrading the stored `yarn.lock` instead would keep the versions it already has."
          labels: dependencies

      - name: Enable auto-merge
        if: steps.pull-request.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PULL_REQUEST: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --squash "$PULL_REQUEST"
